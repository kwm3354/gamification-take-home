<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="760" viewBox="0 0 1060 760" role="img" aria-label="The service and what is outside it"><title>The service and what is outside it</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5866"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5866"/></marker></defs><rect x="0" y="0" width="1060" height="760" rx="14" fill="#ffffff"/><text x="24.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#16191f" text-anchor="start">The service and what is outside it</text><text x="24.0" y="56.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5866" text-anchor="start">Blue: our code. Amber: outside parties (simulated in the prototype). Green: the two stores.</text><rect x="24.0" y="86.0" width="220.0" height="82.0" rx="8" fill="#fdf3e1" stroke="#9a5200" stroke-width="1.2"/><text x="34.0" y="105.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#9a5200" text-anchor="start">Player</text><text x="34.0" y="123.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">the casino's page with our widget</text><text x="34.0" y="139.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">token signed by the operator</text><rect x="24.0" y="196.0" width="220.0" height="82.0" rx="8" fill="#fdf3e1" stroke="#9a5200" stroke-width="1.2"/><text x="34.0" y="215.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#9a5200" text-anchor="start">Operator staff, our ops</text><text x="34.0" y="233.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">admin API with the tenant's key</text><text x="34.0" y="249.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">header X-Admin-Key</text><rect x="24.0" y="316.0" width="220.0" height="300.0" rx="8" fill="#fdf3e1" stroke="#9a5200" stroke-width="1.2" stroke-dasharray="6 4"/><text x="36.0" y="338.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#9a5200" text-anchor="start">Fake casino process</text><text x="36.0" y="355.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5866" text-anchor="start">simulated, separate process</text><rect x="36.0" y="368.0" width="196.0" height="96.0" rx="8" fill="#ffffff" stroke="#9a5200" stroke-width="1.2"/><text x="46.0" y="387.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#9a5200" text-anchor="start">Platform A</text><text x="46.0" y="405.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">answers a reward at once</text><text x="46.0" y="421.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">honours Idempotency-Key</text><text x="46.0" y="437.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">signs events with a timestamp</text><rect x="36.0" y="476.0" width="196.0" height="96.0" rx="8" fill="#ffffff" stroke="#9a5200" stroke-width="1.2"/><text x="46.0" y="495.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#9a5200" text-anchor="start">Platform B</text><text x="46.0" y="513.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">accepts, reports by webhook</text><text x="46.0" y="529.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">no idempotency key</text><text x="46.0" y="545.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">sends deposits in batches</text><text x="36.0" y="598.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5866" text-anchor="start">faults on demand, control page</text><rect x="340.0" y="86.0" width="404.0" height="600.0" rx="8" fill="#eef3fd" stroke="#1f4fbf" stroke-width="1.6"/><text x="354.0" y="108.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f4fbf" text-anchor="start">Our application: one NestJS process, a module per folder</text><rect x="352.0" y="126.0" width="188.0" height="92.0" rx="8" fill="#ffffff" stroke="#1f4fbf" stroke-width="1.2"/><text x="362.0" y="145.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f4fbf" text-anchor="start">Tenants and identity</text><text x="362.0" y="163.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">tenants, players (id mapping)</text><text x="362.0" y="179.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">player token guard</text><text x="362.0" y="195.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">src/tenants</text><rect x="352.0" y="236.0" width="188.0" height="92.0" rx="8" fill="#ffffff" stroke="#1f4fbf" stroke-width="1.2"/><text x="362.0" y="255.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f4fbf" text-anchor="start">Admin and alerts</text><text x="362.0" y="273.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">audit trail, stuck list</text><text x="362.0" y="289.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">manual resolve, 7 alerts</text><text x="362.0" y="305.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">src/admin, src/alerts</text><rect x="352.0" y="346.0" width="188.0" height="92.0" rx="8" fill="#ffffff" stroke="#1f4fbf" stroke-width="1.2"/><text x="362.0" y="365.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f4fbf" text-anchor="start">Wheel</text><text x="362.0" y="383.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">spins, pickSegment</text><text x="362.0" y="399.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">outcome: secret + spin id</text><text x="362.0" y="415.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">src/wheel</text><rect x="352.0" y="456.0" width="188.0" height="92.0" rx="8" fill="#ffffff" stroke="#1f4fbf" stroke-width="1.2"/><text x="362.0" y="475.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f4fbf" text-anchor="start">Integrations</text><text x="362.0" y="493.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">port CasinoPlatform</text><text x="362.0" y="509.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">adapter A, adapter B</text><text x="362.0" y="525.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">src/integrations</text><rect x="352.0" y="566.0" width="188.0" height="92.0" rx="8" fill="#ffffff" stroke="#1f4fbf" stroke-width="1.2"/><text x="362.0" y="585.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f4fbf" text-anchor="start">Store</text><text x="362.0" y="603.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">redemption intent</text><text x="362.0" y="619.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">advance, confirm</text><text x="362.0" y="635.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">src/store</text><rect x="544.0" y="126.0" width="188.0" height="92.0" rx="8" fill="#ffffff" stroke="#1f4fbf" stroke-width="1.2"/><text x="554.0" y="145.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f4fbf" text-anchor="start">Event intake</text><text x="554.0" y="163.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">signature, dedup by key</text><text x="554.0" y="179.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">grant policy (versioned)</text><text x="554.0" y="195.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">src/events, src/policies</text><rect x="544.0" y="236.0" width="188.0" height="92.0" rx="8" fill="#ffffff" stroke="#1f4fbf" stroke-width="1.2"/><text x="554.0" y="255.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f4fbf" text-anchor="start">Outbox</text><text x="554.0" y="273.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">jobs in PostgreSQL</text><text x="554.0" y="289.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">timer every 500 ms</text><text x="554.0" y="305.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">src/outbox</text><rect x="544.0" y="346.0" width="188.0" height="92.0" rx="8" fill="#ffffff" stroke="#1f4fbf" stroke-width="1.2"/><text x="554.0" y="365.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f4fbf" text-anchor="start">Audit</text><text x="554.0" y="383.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">one write path</text><text x="554.0" y="399.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">same transaction</text><text x="554.0" y="415.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">src/audit</text><rect x="544.0" y="456.0" width="188.0" height="92.0" rx="8" fill="#ffffff" stroke="#1f4fbf" stroke-width="1.2"/><text x="554.0" y="475.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f4fbf" text-anchor="start">Ledger adapter</text><text x="554.0" y="493.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">port CoinLedger</text><text x="554.0" y="509.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">fixed transfer ids</text><text x="554.0" y="525.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">src/ledger</text><rect x="544.0" y="566.0" width="188.0" height="92.0" rx="8" fill="#ffffff" stroke="#1f4fbf" stroke-width="1.2"/><text x="554.0" y="585.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f4fbf" text-anchor="start">Logging</text><text x="554.0" y="603.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">one JSON line per event</text><text x="554.0" y="619.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">request id, level by policy</text><text x="554.0" y="635.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">src/logging</text><rect x="862.0" y="160.0" width="174.0" height="150.0" rx="8" fill="#e8f6ee" stroke="#17734a" stroke-width="1.2"/><text x="872.0" y="179.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#17734a" text-anchor="start">PostgreSQL</text><text x="872.0" y="197.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">tenants, players, events</text><text x="872.0" y="213.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">spins, redemptions</text><text x="872.0" y="229.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">policies (versioned)</text><text x="872.0" y="245.6" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">outbox jobs</text><text x="872.0" y="261.8" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">audit log (append-only)</text><rect x="862.0" y="420.0" width="174.0" height="128.0" rx="8" fill="#e8f6ee" stroke="#17734a" stroke-width="1.2"/><text x="872.0" y="439.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#17734a" text-anchor="start">TigerBeetle</text><text x="872.0" y="457.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">coins only</text><text x="872.0" y="473.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">one ledger per tenant</text><text x="872.0" y="489.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">pending, post, void</text><text x="872.0" y="505.6" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">no negative balance</text><rect x="862.0" y="600.0" width="174.0" height="86.0" rx="8" fill="#ffffff" stroke="#9aa3af" stroke-width="1.2" stroke-dasharray="5 4"/><text x="872.0" y="620.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#4f5866" text-anchor="start">Daily digest agent</text><text x="872.0" y="638.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5866" text-anchor="start">reads logs and database</text><text x="872.0" y="654.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5866" text-anchor="start">designed, not built</text><path d="M244.0 150.0 L352.0 150.0" fill="none" stroke="#4f5866" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#head)"/><rect x="244.1" y="129.0" width="95.7" height="17" rx="3" fill="#ffffff"/><text x="292.0" y="141.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4f5866" text-anchor="middle">HTTPS + JWT</text><path d="M244.0 262.0 L352.0 262.0" fill="none" stroke="#4f5866" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#head)"/><rect x="256.6" y="241.0" width="70.7" height="17" rx="3" fill="#ffffff"/><text x="292.0" y="253.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4f5866" text-anchor="middle">admin key</text><path d="M244.0 478.0 L352.0 478.0" fill="none" stroke="#4f5866" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#head)"/><rect x="249.8" y="457.0" width="92.5" height="17" rx="3" fill="#ffffff"/><text x="296.0" y="469.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4f5866" text-anchor="middle">signed events</text><path d="M352.0 508.0 L244.0 508.0" fill="none" stroke="#4f5866" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#head)"/><rect x="249.4" y="487.0" width="93.1" height="17" rx="3" fill="#ffffff"/><text x="296.0" y="499.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4f5866" text-anchor="middle">issue, look up</text><path d="M244.0 538.0 L352.0 538.0" fill="none" stroke="#4f5866" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 3" marker-end="url(#head)"/><rect x="266.1" y="517.0" width="59.7" height="17" rx="3" fill="#ffffff"/><text x="296.0" y="529.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4f5866" text-anchor="middle">B: result</text><path d="M744.0 236.0 L862.0 236.0" fill="none" stroke="#4f5866" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#head)"/><rect x="750.1" y="214.0" width="105.7" height="17" rx="3" fill="#ffffff"/><text x="803.0" y="226.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4f5866" text-anchor="middle">one transaction:</text><rect x="754.4" y="244.0" width="97.2" height="17" rx="3" fill="#ffffff"/><text x="803.0" y="256.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4f5866" text-anchor="middle">row, audit, job</text><path d="M744.0 502.0 L862.0 502.0" fill="none" stroke="#4f5866" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#head)"/><rect x="756.0" y="480.0" width="94.1" height="17" rx="3" fill="#ffffff"/><text x="803.0" y="492.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4f5866" text-anchor="middle">transfers with</text><rect x="750.5" y="510.0" width="105.1" height="17" rx="3" fill="#ffffff"/><text x="803.0" y="522.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4f5866" text-anchor="middle">ids from our ids</text><path d="M744.0 622.0 L862.0 622.0" fill="none" stroke="#4f5866" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 3" marker-end="url(#head)"/><rect x="765.0" y="600.0" width="76.0" height="17" rx="3" fill="#ffffff"/><text x="803.0" y="612.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4f5866" text-anchor="middle">JSON lines</text><text x="24.0" y="724.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5866" text-anchor="start">No transaction spans the two stores. Order: PostgreSQL commit (with the job), then TigerBeetle with a fixed id, then mark done.</text><text x="24.0" y="744.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5866" text-anchor="start">A crash in between is repaired by the outbox job running the same step again.</text></svg>
