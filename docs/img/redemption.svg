<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-label="The life of a redemption"><title>The life of a redemption</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5866"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5866"/></marker></defs><rect x="0" y="0" width="1000" height="700" rx="14" fill="#ffffff"/><text x="24.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#16191f" text-anchor="start">The life of a redemption</text><text x="24.0" y="56.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5866" text-anchor="start">Boxes are statuses in the redemptions table. Each arrow says who moves it. Amber numbers are failure points.</text><rect x="24.0" y="170.0" width="130.0" height="56.0" rx="8" fill="#ffffff" stroke="#1f4fbf" stroke-width="1.2"/><text x="89.0" y="194.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f4fbf" text-anchor="middle">created</text><text x="89.0" y="212.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5866" text-anchor="middle">intent + job</text><rect x="234.0" y="170.0" width="130.0" height="56.0" rx="8" fill="#ffffff" stroke="#1f4fbf" stroke-width="1.2"/><text x="299.0" y="194.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f4fbf" text-anchor="middle">reserved</text><text x="299.0" y="212.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5866" text-anchor="middle">coins held</text><rect x="474.0" y="170.0" width="150.0" height="56.0" rx="8" fill="#ffffff" stroke="#1f4fbf" stroke-width="1.2"/><text x="549.0" y="194.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f4fbf" text-anchor="middle">submitting</text><text x="549.0" y="212.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5866" text-anchor="middle">asking the casino</text><rect x="724.0" y="96.0" width="106.0" height="56.0" rx="8" fill="#eef3fd" stroke="#1f4fbf" stroke-width="1.6"/><text x="777.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f4fbf" text-anchor="middle">issued</text><text x="777.0" y="138.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5866" text-anchor="middle">final for player</text><rect x="724.0" y="266.0" width="106.0" height="56.0" rx="8" fill="#eef3fd" stroke="#1f4fbf" stroke-width="1.6"/><text x="777.0" y="290.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f4fbf" text-anchor="middle">refused</text><text x="777.0" y="308.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5866" text-anchor="middle">final for player</text><rect x="24.0" y="330.0" width="130.0" height="56.0" rx="8" fill="#eef3fd" stroke="#1f4fbf" stroke-width="1.6"/><text x="89.0" y="354.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f4fbf" text-anchor="middle">insufficient</text><text x="89.0" y="372.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5866" text-anchor="middle">final, no call</text><rect x="900.0" y="96.0" width="86.0" height="56.0" rx="8" fill="#e8f6ee" stroke="#17734a" stroke-width="1.2"/><text x="943.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#17734a" text-anchor="middle">settled</text><text x="943.0" y="138.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5866" text-anchor="middle">captured</text><rect x="900.0" y="266.0" width="86.0" height="56.0" rx="8" fill="#e8f6ee" stroke="#17734a" stroke-width="1.2"/><text x="943.0" y="290.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#17734a" text-anchor="middle">settled</text><text x="943.0" y="308.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5866" text-anchor="middle">released</text><path d="M89.0 96.0 L89.0 170.0" fill="none" stroke="#4f5866" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#head)"/><rect x="85.0" y="76.0" width="326.4" height="17" rx="3" fill="#ffffff"/><text x="89.0" y="88.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4f5866" text-anchor="start">player: POST /store/redemptions + Idempotency-Key</text><path d="M154.0 198.0 L234.0 198.0" fill="none" stroke="#4f5866" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#head)"/><rect x="153.8" y="176.0" width="80.4" height="17" rx="3" fill="#ffffff"/><text x="194.0" y="188.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4f5866" text-anchor="middle">job: reserve</text><circle cx="194.0" cy="216.0" r="10" fill="#9a5200"/><text x="194.0" y="220.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><path d="M89.0 226.0 L89.0 330.0" fill="none" stroke="#4f5866" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#head)"/><rect x="94.0" y="288.0" width="167.9" height="17" rx="3" fill="#ffffff"/><text x="98.0" y="300.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4f5866" text-anchor="start">ledger refuses the reserve</text><path d="M364.0 198.0 L474.0 198.0" fill="none" stroke="#4f5866" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#head)"/><rect x="363.6" y="176.0" width="110.8" height="17" rx="3" fill="#ffffff"/><text x="419.0" y="188.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4f5866" text-anchor="middle">job: commit first</text><path d="M624.0 184.0 L672.0 184.0 L672.0 124.0 L724.0 124.0" fill="none" stroke="#4f5866" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#head)"/><rect x="608.2" y="100.0" width="61.8" height="17" rx="3" fill="#ffffff"/><text x="666.0" y="112.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4f5866" text-anchor="end">confirm()</text><path d="M624.0 212.0 L672.0 212.0 L672.0 294.0 L724.0 294.0" fill="none" stroke="#4f5866" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#head)"/><rect x="608.2" y="302.0" width="61.8" height="17" rx="3" fill="#ffffff"/><text x="666.0" y="314.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4f5866" text-anchor="end">confirm()</text><circle cx="646.0" cy="164.0" r="10" fill="#9a5200"/><text x="646.0" y="168.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><path d="M520.0 226.0 L520.0 266.0 L578.0 266.0 L578.0 226.0" fill="none" stroke="#4f5866" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#head)"/><rect x="427.8" y="274.0" width="242.3" height="17" rx="3" fill="#ffffff"/><text x="549.0" y="286.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4f5866" text-anchor="middle">pending or no answer: look again later</text><circle cx="598.0" cy="248.0" r="10" fill="#9a5200"/><text x="598.0" y="252.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><path d="M830.0 124.0 L900.0 124.0" fill="none" stroke="#4f5866" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#head)"/><rect x="838.5" y="102.0" width="53.0" height="17" rx="3" fill="#ffffff"/><text x="865.0" y="114.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4f5866" text-anchor="middle">capture</text><path d="M830.0 294.0 L900.0 294.0" fill="none" stroke="#4f5866" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#head)"/><rect x="838.9" y="272.0" width="52.2" height="17" rx="3" fill="#ffffff"/><text x="865.0" y="284.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4f5866" text-anchor="middle">release</text><circle cx="865.0" cy="152.0" r="10" fill="#9a5200"/><text x="865.0" y="156.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><rect x="234.0" y="330.0" width="380.0" height="118.0" rx="8" fill="#eef3fd" stroke="#1f4fbf" stroke-width="1.2"/><text x="246.0" y="352.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f4fbf" text-anchor="start">confirm() is the only way to a final status</text><text x="246.0" y="372.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">Called from: platform A's answer, the status look-up</text><text x="246.0" y="388.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">(both in the job step), platform B's webhook, an admin.</text><text x="246.0" y="404.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">Acts only on submitting, under the row lock; any later</text><text x="246.0" y="420.6" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">call changes nothing.</text><circle cx="596.0" cy="348.0" r="10" fill="#9a5200"/><text x="596.0" y="352.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><rect x="644.0" y="400.0" width="342.0" height="48.0" rx="8" fill="#ffffff" stroke="#9aa3af" stroke-width="1.2" stroke-dasharray="5 4"/><text x="656.0" y="420.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5866" text-anchor="start">Rule for the casino: look first, then issue.</text><text x="656.0" y="436.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5866" text-anchor="start">Rule for the ledger: repeat freely, the id is fixed.</text><text x="24.0" y="486.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#16191f" text-anchor="start">Failure points (rows and tests in docs/failure-table.md)</text><circle cx="36.0" cy="508.0" r="10" fill="#9a5200"/><text x="36.0" y="512.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="56.0" y="512.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">Crash between the ledger reserve and the status write: the job repeats the reserve with the same id.</text><circle cx="36.0" cy="534.0" r="10" fill="#9a5200"/><text x="36.0" y="538.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="56.0" y="538.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">Answer lost, timeout, 500 or 429: never refused; status stays submitting and the next run looks first.</text><circle cx="36.0" cy="560.0" r="10" fill="#9a5200"/><text x="36.0" y="564.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="56.0" y="564.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">Platform B's callback lost or sent twice: the look-up finds the result; a second notice changes nothing.</text><circle cx="36.0" cy="586.0" r="10" fill="#9a5200"/><text x="36.0" y="590.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="56.0" y="590.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">Ledger away while settling: shows issued, settled false; the job captures later, once.</text><circle cx="36.0" cy="612.0" r="10" fill="#9a5200"/><text x="36.0" y="616.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="56.0" y="616.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">No answer at all: alert on age, then an admin resolves through confirm(); a late answer that disagrees</text><text x="56.0" y="634.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#16191f" text-anchor="start">is written as outcome_contradicted.</text><text x="24.0" y="680.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5866" text-anchor="start">Not drawn: revoking a reward after it was issued (not built).</text></svg>
