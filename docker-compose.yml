# Local dependencies for running the prototype by hand. Tests start their own PostgreSQL.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["54329:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 1s
      timeout: 2s
      retries: 30
  # The coin ledger. A single replica with a throwaway data file: enough for a prototype.
  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
    # The official image needs a CPU with AVX2 and exits with code 132 without it. On such a
    # machine run ./scripts/tb-old-cpu.sh once and use this line instead of the one above:
    # image: tigerbeetle-oldcpu:0.17.9
    # TigerBeetle uses io_uring, which Docker's default seccomp profile can block.
    security_opt: ["seccomp=unconfined"]
    # The data file must be formatted once before the first start.
    entrypoint:
      - sh
      - -c
      - |
        f=/data/0_0.tigerbeetle
        [ -f "$$f" ] || /tigerbeetle format --cluster=0 --replica=0 --replica-count=1 --development "$$f" || exit 1
        exec /tigerbeetle start --addresses=0.0.0.0:3000 --development "$$f"
    volumes: ["tigerbeetle-data:/data"]
    ports: ["30009:3000"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "3000"]
      interval: 1s
      timeout: 2s
      retries: 30

volumes:
  tigerbeetle-data:
