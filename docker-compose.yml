# The prototype and what it depends on. Tests start their own PostgreSQL.
# Host ports can be moved when they are taken: APP_PORT, FAKE_PORT, PG_PORT, TB_PORT (in the shell or in a .env file).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["${PG_PORT:-54329}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 1s
      timeout: 2s
      retries: 30
  # The coin ledger. A single replica with a throwaway data file: enough for a prototype.
  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
    # The official image needs a CPU with AVX2 and exits with code 132 without it. On such a
    # machine run ./scripts/tb-old-cpu.sh once and use this line instead of the one above:
    # image: tigerbeetle-oldcpu:0.17.9
    # TigerBeetle uses io_uring, which Docker's default seccomp profile can block.
    security_opt: ["seccomp=unconfined"]
    # The data file must be formatted once before the first start.
    entrypoint:
      - sh
      - -c
      - |
        f=/data/0_0.tigerbeetle
        [ -f "$$f" ] || /tigerbeetle format --cluster=0 --replica=0 --replica-count=1 --development "$$f" || exit 1
        exec /tigerbeetle start --addresses=0.0.0.0:3000 --development "$$f"
    volumes: ["tigerbeetle-data:/data"]
    ports: ["${TB_PORT:-30009}:3000"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "3000"]
      interval: 1s
      timeout: 2s
      retries: 30

  # The app. Host port 30080.
  app:
    build: .
    # The TigerBeetle client inside the app also uses io_uring, so the app needs this line too.
    security_opt: ["seccomp=unconfined"]
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app
      TB_ADDRESS: tigerbeetle:3000
      PORT: "3000"
      SEED_DEMO: "1"
      FAKE_CASINO_URL: http://fake-casino:4000
      # The fake casino's address as the browser sees it. The web app at /app/ uses it.
      PUBLIC_FAKE_CASINO_URL: http://localhost:${FAKE_PORT:-30081}
      # Traces go to jaeger. If jaeger is down the app works the same. Remove the first line to turn tracing off.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: gamification
      # Share of requests that are traced, 0 to 1. Lower it for a load run.
      OTEL_TRACES_SAMPLE_RATIO: ${OTEL_TRACES_SAMPLE_RATIO:-1}
    depends_on:
      postgres: { condition: service_healthy }
      tigerbeetle: { condition: service_healthy }
    ports: ["${APP_PORT:-30080}:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The fake casino: plays both platforms, can be told to fail, and shows what the casino saw.
  # Host port 30081. The app does not depend on it; it is only called when a grant is made.
  fake-casino:
    build: .
    command: ["node", "dist/fake-casino/main.js"]
    environment:
      PORT: "4000"
      APP_URL: http://app:3000
      # The app's address as the browser on the host sees it (the playground page at / uses it).
      PUBLIC_APP_URL: http://localhost:${APP_PORT:-30080}
    ports: ["${FAKE_PORT:-30081}:4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/control/state').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Trace viewer. Open http://localhost:30086 and pick the service "gamification". Traces are kept in
  # memory only (at most 10000) and are lost when the container stops. The app does not depend on it.
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      MEMORY_MAX_TRACES: "10000"
    ports: ["${JAEGER_PORT:-30086}:16686"]

volumes:
  tigerbeetle-data:
